<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Your Email</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px;">

<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">

    <div style="text-align: center; margin-bottom: 20px;">
        <img src="https://via.placeholder.com/150x50.png?text=CarDealer" alt="CarDealer Logo" style="display: block; margin: 0 auto;"/>
    </div>

    <h2 style="color: #333333;">Hi ${name},</h2>
    <p style="color: #555555;">Thank you for registering. Please verify your email address by clicking the button below:</p>

    <div style="text-align: center; margin: 30px 0;">
        <a href="${link}" style="background-color: #007bff; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold;">Verify Email</a>
    </div>

    <p style="color: #555555;">If you did not request this, you can safely ignore this email.</p>

    <p style="color: #999999; font-size: 12px; text-align: center; margin-top: 40px;">
        © 2025 CarDealer. All rights reserved.
    </p>

</div>

</body>
</html>
